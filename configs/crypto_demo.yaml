# Small single-GPU config for scripts/validate.sh — a quick end-to-end smoke test,
# not a paper-quality run. See crypto_top20.yaml for the full recipe.

# ── universe ────────────────────────────────────────────────────────────────
symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - XRPUSDT

# ── data ────────────────────────────────────────────────────────────────────
# Same date range as crypto_top20.yaml (finetune/config.py's Phase2Config hardcodes
# these train/val periods, so the downloaded CSVs must cover them for
# scripts/validate.sh's fine-tuning step to see any windows). Fewer symbols is what
# actually makes this a "demo" — the date range is unchanged.
data_dir: /scratch/$USER/Kronos/data
frequency: 15m
download_start: '2021-01-01'
download_end:   '2025-06-01'

train_period: ['2021-01-01', '2023-12-31']
val_period:   ['2024-01-01', '2024-06-30']
test_period:  ['2024-07-01', '2025-06-01']

# ── windows ─────────────────────────────────────────────────────────────────
lookback:  160
pred_len:  32
stride:    32

# ── inference ───────────────────────────────────────────────────────────────
n_rollouts: 10
max_context: 512
clip: 5.0
top_p: 0.90
top_k: 0

zero_vol_amount: true

runs:
  - name: forecast
    temperature: 0.6
    n_rollouts: 10
    metrics: [price_ic, return_ic, acf2_gap]
  - name: volatility
    temperature: 0.9
    n_rollouts: 1
    metrics: [vol_mae]

# ── metrics ─────────────────────────────────────────────────────────────────
acf_lags: 15
acf_floor_eps: 1e-16

# ── compute ─────────────────────────────────────────────────────────────────
n_gpus: 1
batch_size_per_gpu: 4
fp16: true

# ── model ───────────────────────────────────────────────────────────────────
tokenizer_id: NeoQuasar/Kronos-Tokenizer-base
model_id:     NeoQuasar/Kronos-base

# ── output ──────────────────────────────────────────────────────────────────
output_dir: outputs/
results_file: baseline_crypto_demo.json
predictions_cache_dir: /scratch/$USER/Kronos/predictions/demo
