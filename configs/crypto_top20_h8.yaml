# H=96 (24h horizon) config — same universe as crypto_top20 but longer horizon.
# Motivation: ACF² clustering signal is ~3× stronger at 24h vs 8h (ρ₁≈0.13 vs ρ₁≈0.06),
# giving more meaningful headroom for Phase 2 fine-tuning.

# ── universe ────────────────────────────────────────────────────────────────
symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - XRPUSDT
  - ADAUSDT
  - DOGEUSDT
  - AVAXUSDT
  - DOTUSDT
  - MATICUSDT
  - LINKUSDT
  - LTCUSDT
  - BCHUSDT
  - ATOMUSDT
  - UNIUSDT
  - ETCUSDT
  - XLMUSDT
  - FILUSDT
  - NEARUSDT
  - APTUSDT

# ── data ────────────────────────────────────────────────────────────────────
data_dir: /scratch/$USER/Kronos/data
frequency: 15m
download_start: '2021-01-01'
download_end:   '2025-06-01'

train_period: ['2021-01-01', '2023-12-31']
val_period:   ['2024-01-01', '2024-06-30']
test_period:  ['2024-07-01', '2025-06-01']

# ── windows ─────────────────────────────────────────────────────────────────
lookback:  160   # paper Table 8: 15-min frequency lookback
pred_len:  8    # H8 rung cua ladder
stride:    8    # non-overlapping

# ── inference ───────────────────────────────────────────────────────────────
n_rollouts: 10
max_context: 512
clip: 5.0
top_p: 0.90
top_k: 0

zero_vol_amount: true

runs:
  - name: forecast
    temperature: 0.6
    n_rollouts: 10
    metrics: [price_ic, return_ic, acf2_gap]
  - name: volatility
    temperature: 0.9
    n_rollouts: 1
    metrics: [vol_mae]

# ── metrics ─────────────────────────────────────────────────────────────────
acf_lags: 3   # H=8 -> 7 sq-returns, T >= 2K requires K <= 3
acf_floor_eps: 1e-16

# ── compute ─────────────────────────────────────────────────────────────────
n_gpus: 2
batch_size_per_gpu: 4     # smaller batch: H=96 uses ~3× more memory than H=32
fp16: true

# ── model ───────────────────────────────────────────────────────────────────
tokenizer_id: NeoQuasar/Kronos-Tokenizer-base
model_id:     NeoQuasar/Kronos-base

# ── output ──────────────────────────────────────────────────────────────────
output_dir: outputs/
results_file: baseline_crypto_top20_h8.json
# pkl files go to scratch — large storage, not backed up, survives job duration
predictions_cache_dir: /scratch/$USER/Kronos/predictions/crypto_top20_h8
